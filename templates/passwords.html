<!DOCTYPE html>
<html>
<head>
    <title>Saved Passwords</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Saved Passwords</h2>

        <!-- Top buttons -->
        <div class="top-buttons">
            <a href="/add" class="nav-btn">Add New</a>
            <a href="/logout" class="nav-btn">Logout</a>
        </div>

        <table>
            <tr>
                <th>Site</th>
                <th>Username</th>
                <th>Password</th>
                <th>Action</th>
            </tr>

            {% for p in passwords %}
            <tr>
                <td>{{ p.site }}</td>
                <td>{{ p.username }}</td>

                <!-- Password with toggle -->
                <td>
                    <span id="pass{{ p.id }}">******</span>
                    <button onclick="togglePassword('{{ p.password }}', 'pass{{ p.id }}')">
                        Show
                    </button>
                </td>

                <!-- Delete button -->
                <td>
                    <a href="/delete/{{ p.id }}" class="delete-btn">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <script>
    function togglePassword(realPass, elementId) {
        const el = document.getElementById(elementId);

        if (el.innerText === "******") {
            el.innerText = realPass;
        } else {
            el.innerText = "******";
        }
    }
    </script>
</body>
</html>
